# Publishes the website in docs/ to GitHub Pages: https://mrddream.github.io/Snaplume/
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Actions are pinned to full commit SHAs (the comment gives the tag); update both together.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # The site is docs/ without the logo drafts (docs/branding/proposals): only the final logo is published.
      - name: Prepare the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R docs/. "$RUNNER_TEMP/site/"
          rm -rf "$RUNNER_TEMP/site/branding/proposals"

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
