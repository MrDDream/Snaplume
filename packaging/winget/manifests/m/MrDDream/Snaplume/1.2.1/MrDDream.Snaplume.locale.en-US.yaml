ShortDescription: Free, open-source screenshots, annotations and screen recording. 100% offline.
Description: |-
  Snaplume captures a region, a window, a screen or a scrolling page, annotates it (arrows, shapes, text,
  blur, numbered steps), records the screen as MP4 with sound and webcam, reads text (OCR) and QR codes,
  and keeps everything in local workspaces. No account, no cloud, no telemetry.
