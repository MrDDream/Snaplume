name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the "v" (e.g. 1.0.0). The tag v<version> is created on the selected branch if it does not exist.'
        required: true
        type: string

# Granted per job, to the jobs that need them.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build the Windows packages and create the draft release
    runs-on: windows-latest
    permissions:
      contents: write   # creates the release and uploads its files
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $version = $env:INPUT_VERSION } else { $version = $env:GITHUB_REF_NAME }
          $version = $version.Trim() -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Invalid version '$version': expected a tag like v1.2.3 or v1.2.3-beta.1."
          }
          [xml]$props = Get-Content Directory.Build.props -Raw
          $projectVersion = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($projectVersion -ne $version) {
            Write-Host "::warning::Releasing $version but Directory.Build.props says $projectVersion (the build uses $version)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          if ($version.Contains('-')) { "prerelease=true" >> $env:GITHUB_OUTPUT } else { "prerelease=false" >> $env:GITHUB_OUTPUT }
          Write-Host "Version $version (tag v$version)"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.4xx   # the feature band of global.json, latest patch

      # Always this version, even when the runner image has another one: the installer is built the same way each time.
      - name: Install Inno Setup
        id: inno
        env:
          INNO_VERSION: '6.7.1'
        run: |
          choco install innosetup --version $env:INNO_VERSION --force --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)." }
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup.' }
          $installed = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          if (-not "$installed".StartsWith($env:INNO_VERSION)) { throw "Inno Setup $installed found at $iscc, expected $env:INNO_VERSION." }
          Write-Host "Inno Setup $installed ($iscc)"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Install WiX Toolset 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed ($LASTEXITCODE)." }

      - name: Build the packages
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ISCC: ${{ steps.inno.outputs.iscc }}
        # AppLocal: the MSI needs the Visual C++ runtime DLLs next to Snaplume.exe (fails if Visual Studio has none).
        run: ./build/build-release.ps1 -Version $env:VERSION -VCRuntime AppLocal -IsccPath $env:ISCC

      - name: Check the packages
        env:
          ZIP_FILE: ${{ steps.build.outputs.zip }}
          SETUP_FILE: ${{ steps.build.outputs.setup }}
          MSI_FILE: ${{ steps.build.outputs.msi }}
          SUMS_FILE: ${{ steps.build.outputs.sums }}
        run: |
          $files = @($env:ZIP_FILE, $env:SETUP_FILE, $env:MSI_FILE, $env:SUMS_FILE)
          foreach ($f in $files) {
            if (-not $f -or -not (Test-Path -LiteralPath $f)) { throw "Missing release file: '$f' (were the installers built?)." }
            Write-Host ('{0,-45} {1,10:N1} MB' -f (Split-Path -Leaf $f), ((Get-Item -LiteralPath $f).Length / 1MB))
          }
          Get-Content -LiteralPath $env:SUMS_FILE

      - name: Upload the packages as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snaplume-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.setup }}
            ${{ steps.build.outputs.msi }}
            ${{ steps.build.outputs.sums }}
          if-no-files-found: error

      # A draft: published by the linux job once its packages are attached too, so that no one (nor Snaplume's update
      # check) sees a release without its Linux files.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SETUP_FILE: ${{ steps.build.outputs.setup }}
          MSI_FILE: ${{ steps.build.outputs.msi }}
          ZIP_FILE: ${{ steps.build.outputs.zip }}
          SUMS_FILE: ${{ steps.build.outputs.sums }}
        run: |
          $files = @($env:SETUP_FILE, $env:MSI_FILE, $env:ZIP_FILE, $env:SUMS_FILE)
          if (@($files | Where-Object { -not $_ }).Count -gt 0) { throw "A release file path is empty: $($files -join ', ')" }

          # The release already exists (workflow run again for the same tag): replace the files of the draft. A
          # published release is never changed: users may have downloaded its files, which their checksums vouch for.
          $isDraft = gh release view $env:TAG --json isDraft --jq .isDraft 2> $null
          if ($LASTEXITCODE -eq 0) {
            if ("$isDraft".Trim() -ne 'true') {
              throw "The release $env:TAG is already published: its files are not replaced. Release a new version, or delete the release first to build it again."
            }
            gh release upload $env:TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)." }
            return
          }

          # Release notes: the template without its leading HTML comment, {{VERSION}} replaced.
          $notes = Get-Content build/release-notes.md -Raw -Encoding utf8
          $notes = ($notes -replace '(?s)^\s*<!--.*?-->\s*', '').Replace('{{VERSION}}', $env:VERSION)
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8NoBOM

          $ghArgs = @(
            'release', 'create', $env:TAG
          ) + $files + @(
            '--title', "Snaplume $env:VERSION",
            '--notes-file', $notesFile,
            '--generate-notes',
            '--draft'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $ghArgs += '--verify-tag'          # the pushed tag
          } else {
            $ghArgs += @('--target', $env:GITHUB_SHA)   # the tag is created on this commit when the draft is published
          }
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }

  linux:
    name: Build the Linux packages, add them to the release and publish it
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # uploads the packages and publishes the release
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NFPM_VERSION: '2.47.0'
      # SHA-256 of nfpm_2.47.0_Linux_x86_64.tar.gz, from the release's checksums.txt; update both together.
      NFPM_SHA256: '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.4xx   # the feature band of global.json, latest patch

      - name: Install nfpm (pinned checksum)
        run: |
          $base = "https://github.com/goreleaser/nfpm/releases/download/v$env:NFPM_VERSION"
          $archive = "nfpm_$($env:NFPM_VERSION)_Linux_x86_64.tar.gz"
          $tools = Join-Path $env:RUNNER_TEMP 'nfpm'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest "$base/$archive" -OutFile (Join-Path $tools $archive)
          # Checked against the sum written here, not against a checksums.txt fetched from the same place.
          $actual = (Get-FileHash (Join-Path $tools $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:NFPM_SHA256) { throw "nfpm checksum mismatch ($actual, expected $env:NFPM_SHA256)." }
          tar -xzf (Join-Path $tools $archive) -C $tools nfpm
          "$tools" >> $env:GITHUB_PATH

      - name: Build the packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: ./build/build-linux.ps1 -Version $env:VERSION

      - name: Add them to the release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $files = @(Get-ChildItem artifacts/linux -File | Where-Object { $_.Extension -in '.deb', '.rpm' })
          if ($files.Count -lt 2) { throw "Linux packages missing: $($files.Name -join ', ')" }
          # Only into the draft created by the release job: a published release keeps its files.
          $isDraft = gh release view $env:TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0) { throw "gh release view $env:TAG failed ($LASTEXITCODE)." }
          if ("$isDraft".Trim() -ne 'true') {
            throw "The release $env:TAG is already published: its files are not replaced. Release a new version, or delete the release first to build it again."
          }
          # Next to the Windows SHA256SUMS.txt of the release.
          Copy-Item artifacts/linux/SHA256SUMS artifacts/linux/SHA256SUMS-linux.txt
          gh release upload $env:TAG @($files.FullName) artifacts/linux/SHA256SUMS-linux.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)." }
          # Every file is there: the release is published (the tag is created now for a workflow_dispatch run).
          gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw "gh release edit --draft=false failed ($LASTEXITCODE)." }
