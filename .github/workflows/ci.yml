name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.4xx   # the feature band of global.json, latest patch

      # The whole solution on Windows; on Linux, everything but the Windows-only projects (the tests build
      # Snaplume.Core, the Linux build of Snaplume.App and Snaplume.Platform.Linux).
      - name: Build
        if: runner.os == 'Windows'
        run: dotnet build Snaplume.slnx -c Release

      - name: Test
        run: dotnet test tests/Snaplume.Tests -c Release

